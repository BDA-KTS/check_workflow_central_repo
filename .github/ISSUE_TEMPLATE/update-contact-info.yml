name: Update contact information
description: Please update the contact information for the following method/tutorial, as the existing contact is not reachable.
title: "Contact update"

body:
  - type: input
    id: title
    attributes:
      label: Methods Hub method/tutorial title
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Methods Hub method/tutorial link
      description: Provide the GitHub repository where the method/tutorial is maintained.
      placeholder: "https://github.com/organization/repository"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Reviewer:** Link this issue in the method/tutorial repository issue with outdated contact information.

        **Developer:** Update contact information in the method/tutorial repository and close the issues (in your repository and the main issue linked in there)  
