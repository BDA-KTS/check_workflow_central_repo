name: Update contact information
description: Request an update to the contact information for a method/tutorial when the existing contact is no longer reachable.
title: "Update contact information"

body:
  - type: input
    id: title
    attributes:
      label: Methods Hub method/tutorial title
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Methods Hub method/tutorial link
      description: Provide the GitHub repository where the method/tutorial is maintained.
      placeholder: "https://github.com/organization/repository"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Reviewer

        Please link this issue in the method/tutorial repository issue for the outdated contact information.

  - type: markdown
    attributes:
      value: |
        ## Developer

        Please update the contact information in the method/tutorial repository, close its repository issue, and also respond to the main issue linked there.
