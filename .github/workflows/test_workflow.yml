name: Report Creator
permissions:
  contents: write

on:
  repository_dispatch:
    types: [report_creator]


jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout central repository
        uses: actions/checkout@v6
        with:
          path: 'central'

      - name: Checkout repository to test
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          repository: '${{ github.event.client_payload.repository_full_name }}'
          ref: ${{ github.event.client_payload.repo_hash }}
          path: 'testee'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r central/requirements.txt

      - name: Generate Report
        run: python central/report_creator.py
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}

      - name: Commit and Push the Report
        working-directory: central
        shell: bash
        run: |
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          REPORT_PATH="review_outputs/report/${{ github.event.client_payload.repository_full_name }}.md"
          [ -f "$REPORT_PATH" ] || { echo "Report file not found: $REPORT_PATH"; exit 1; }
          
          git add "$REPORT_PATH"
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Add report for ${{ github.event.client_payload.repository_full_name }}"
          
          for i in 1 2 3 4 5; do
            echo "Push attempt $i"
          
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
          
            WAIT=$((i * 2))
            echo "Push failed, retrying in ${WAIT}s..."
            sleep "$WAIT"
          done
          
          echo "Push failed after 5 attempts"
          git status --short
          exit 1

      - name: Commit and Push the Aggregation
        working-directory: central
        shell: bash
        run: |
          set -euo pipefail
      
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          AGGREGATION_PATH="review_outputs/aggregation/${{ github.event.client_payload.repository_full_name }}.jsonl"
          [ -f "$AGGREGATION_PATH" ] || { echo "Report file not found: $AGGREGATION_PATH"; exit 1; }
      
          git add "$AGGREGATION_PATH"
      
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
      
          git commit -m "Update report aggregation"
      
          for i in 1 2 3 4 5; do
            echo "Push attempt $i"
      
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
      
            WAIT=$((i * 2))
            echo "Push failed, retrying in ${WAIT}s..."
            sleep "$WAIT"
          done
      
          echo "Push failed after 5 attempts"
          git status --short
          exit 1