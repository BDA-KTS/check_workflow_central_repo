name: Report Creator
permissions:
  contents: write

on:
  repository_dispatch:
    types: [report_creator, public_report_creator]


jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout central repository
        uses: actions/checkout@v6
        with:
          path: 'central'

      - name: Checkout repository to test
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          repository: '${{ github.event.client_payload.repository_full_name }}'
          ref: ${{ github.event.client_payload.repo_hash }}
          path: 'testee'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r central/requirements.txt

      - name: Generate Report
        run: python central/report_creator.py
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}

      - name: Commit and Push Report Outputs
        working-directory: central
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ github.event.action }}" = "public_report_creator" ]; then
            OUTPUT_DIR="public_outputs"
          else
            OUTPUT_DIR="review_outputs"
          fi

          REPORT_PATH="${OUTPUT_DIR}/report/${{ github.event.client_payload.repository_full_name }}.md"
          AGGREGATION_PATH="${OUTPUT_DIR}/aggregation/${{ github.event.client_payload.repository_full_name }}.jsonl"

          [ -f "$REPORT_PATH" ] || { echo "Report file not found: $REPORT_PATH"; exit 1; }
          [ -f "$AGGREGATION_PATH" ] || { echo "Aggregation file not found: $AGGREGATION_PATH"; exit 1; }

          git add "$REPORT_PATH" "$AGGREGATION_PATH"

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update report outputs for ${{ github.event.client_payload.repository_full_name }}"